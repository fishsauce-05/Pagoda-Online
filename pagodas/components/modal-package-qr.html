<div class="modal fade" id="qr-package-modal" tabindex="-1" aria-labelledby="qr-package-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="qr-package-title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center">
        <img id="qr-package-image" class="img-fluid rounded-3 border border-light-subtle d-none" alt="Mã QR thanh toán gói lễ">
        <p id="qr-package-message" class="text-muted mb-0"></p>
        <button id="qr-package-paid-btn" type="button" class="btn btn-primary mt-3 d-none">Tôi đã thanh toán</button>
      </div>
    </div>
  </div>
</div>
